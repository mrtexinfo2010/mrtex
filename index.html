<!-- Dynamic Upload Section -->
  <section id="upload" class="section upload-section">
    <div class="container">
      <div class="section-header">
        <h2>Upload Product</h2>
        <p>Add new machinery photos and technical details to your live catalog</p>
      </div>

      <form id="productForm" class="form-box">
        <div class="form-row">
          <div class="form-group">
            <label>Product Name *</label>
            <input type="text" id="pName" required placeholder="e.g., High Speed Single Jersey Machine">
          </div>
          <div class="form-group">
            <label>Category *</label>
            <select id="pCategory" required>
              <option value="single-jersey">Single Jersey</option>
              <option value="double-jersey">Double Jersey</option>
              <option value="jacquard">Computerized Jacquard</option>
              <option value="spare-parts">Needles & Accessories</option>
            </select>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label>Price / Quote *</label>
            <input type="text" id="pPrice" required placeholder="e.g., Contact for Quote / $15,000">
          </div>
          <div class="form-group">
            <label>Upload Image (JPG/PNG) *</label>
            <input type="file" id="pImageFile" accept="image/png, image/jpeg, image/jpg" required>
          </div>
        </div>

        <div class="form-group">
          <label>Specifications / Description *</label>
          <textarea id="pDesc" rows="4" required placeholder="Gauge, Diameter, Feeders count, Speed RPM details..."></textarea>
        </div>

        <button type="submit" class="btn btn-primary btn-full">Publish Product</button>
      </form>
    </div>
  </section>
