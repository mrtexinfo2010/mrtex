<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Upload Product - M.R.TEX</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="form-container">
    <h2>Upload Product</h2>
    <p class="subtitle">Add new machinery photos and technical details to your live catalog</p>

    <form id="uploadForm">
      
      <div class="form-group">
        <label for="productName">Product Name *</label>
        <input type="text" id="productName" placeholder="e.g., High Speed Single Jersey Machine" required>
      </div>

      <div class="form-group">
        <label for="category">Category *</label>
        <select id="category" required>
          <option value="" disabled selected>Select Category</option>
          <option value="Single Jersey">Single Jersey</option>
          <option value="Double Jersey">Double Jersey</option>
          <option value="Auto Stripe">Auto Stripe</option>
          <option value="Accessories">Accessories & Spare Parts</option>
        </select>
      </div>

      <div class="form-group">
        <label for="price">Price / Quote *</label>
        <input type="text" id="price" placeholder="e.g., Contact for Quote / $15,000" required>
      </div>

      <div class="form-group">
        <label for="productImage">Upload Image (JPG/PNG) *</label>
        <input type="file" id="productImage" accept="image/png, image/jpeg" required>
      </div>

      <div class="form-group">
        <label for="specifications">Specifications / Description *</label>
        <textarea id="specifications" rows="4" placeholder="Gauge, Diameter, Feeders count, Speed RPM details..." required></textarea>
      </div>

      <button type="submit" class="submit-btn">Publish Product</button>

    </form>
  </div>

  <script src="script.js"></script>
</body>
</html>
